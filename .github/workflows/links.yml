name: Permit links

on:
  schedule:
    # Mondays 06:00 UTC — catch external URL rot without blocking every PR.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check legal / permit HTTPS URLs
        run: npm run links:check
