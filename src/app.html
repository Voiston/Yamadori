<!doctype html>

<html lang="fr">

	<head>

		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<meta name="theme-color" content="#1a2e1a" />

		<!--
			CSP for Capacitor WebView (androidScheme: https).
			script-src keeps 'unsafe-inline' because adapter-static injects an inline
			SvelteKit bootstrap in index.html (kit.start). Remote scripts stay blocked.
			connect-src is pinned to known API/tile hosts (see src/lib/utils/cspConnectHosts.ts).
			img-src keeps https: for any remaining image CDNs; MapLibre tiles use connect-src.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://archive-api.open-meteo.com https://nominatim.openstreetmap.org https://apicarto.ign.fr https://data.geopf.fr https://api-lannuaire.service-public.gouv.fr https://ovc.catastro.meh.es http://ovc.catastro.meh.es https://ccff02.minfin.fgov.be https://wms.cartografia.agenziaentrate.gov.it https://snicws.dgterritorio.gov.pt https://api.kartverket.no https://service.pdok.nl https://inspire.landregistry.gov.uk https://gdi.berlin.de https://www.geodaten-mv.de https://www.geodatenportal.sachsen-anhalt.de https://geodienste.hamburg.de https://geodienste.bremen.de https://www.wfs.nrw.de https://owsproxy.lgl-bw.de https://geo5.service24.rlp.de https://api3.geo.admin.ch https://wmts.geo.admin.ch https://maps.zh.ch https://wfs.geo.bs.ch https://bio.discomap.eea.europa.eu https://edits.nationalmap.gov https://maps-cartes.ec.gc.ca https://mapserver.doc.govt.nz https://gis.environment.gov.au https://services.arcgis.com https://services1.arcgis.com https://services-eu1.arcgis.com https://datamap.gov.wales https://environment.data.gov.uk https://ogc.nature.scot https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org https://server.arcgisonline.com https://basemap.nationalmap.gov https://mapsneu.wien.gv.at https://maps1.wien.gv.at https://maps2.wien.gv.at https://maps3.wien.gv.at https://maps4.wien.gv.at https://cache.kartverket.no https://sgx.geodatenzentrum.de https://www.ign.es https://servicios.idee.es https://api.os.uk; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
		/>

		<script src="%sveltekit.assets%/boot-theme.js"></script>

		<meta name="description" content="Repérage d'arbres en forêt — Yamadori Scouting" />

		%sveltekit.head%

	</head>

	<body data-sveltekit-preload-data="hover">

		<div style="display: contents">%sveltekit.body%</div>

	</body>

</html>
