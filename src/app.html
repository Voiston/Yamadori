<!doctype html>

<html lang="fr">

	<head>

		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<meta name="theme-color" content="#1a2e1a" />

		<!--
			CSP for Capacitor WebView (androidScheme: https).
			script-src keeps 'unsafe-inline' because adapter-static injects an inline
			SvelteKit bootstrap in index.html (kit.start). Remote scripts stay blocked.
			connect-src allows https APIs (tiles, weather, cadastre) plus the ES cadastre HTTP fallback.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://ovc.catastro.meh.es; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
		/>

		<script src="%sveltekit.assets%/boot-theme.js"></script>

		<meta name="description" content="Repérage d'arbres en forêt — Yamadori Scouting" />

		%sveltekit.head%

	</head>

	<body data-sveltekit-preload-data="hover">

		<div style="display: contents">%sveltekit.body%</div>

	</body>

</html>
